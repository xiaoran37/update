name: '🔄 GitHub 同步助手 (67 → 37)'
# Cross-repository synchronization（时间戳+大小双校验）
# 跨仓库同步（高效增量+覆盖）🔄🔀♻️⚡🚀🌐🔧✅

on:
  workflow_dispatch:
    inputs:
      # 同步模式选择
      sync_mode:
        description: '同步模式选择'
        type: choice
        required: true
        options:
          - '单一仓库'
          - '全部仓库'
        default: '单一仓库'
      
      # 单一仓库模式参数
      single_source:
        description: '源仓库信息（用户/仓库名@分支）'
        type: string
        required: false
        default: 'xiaoran67/core@main'
      single_source_folder:
        description: '源仓库同步路径（留空=根目录）'
        type: string
        required: false
        default: ''
      single_target:
        description: '目标仓库信息（用户/仓库名@分支）'
        type: string
        required: false
        default: 'xiaoran37/core@main'
      single_target_folder:
        description: '目标仓库接收路径（留空=根目录）'
        type: string
        required: false
        default: ''
      
      # Token配置
      source_token_name:
        description: '源仓库Token的Secret名称'
        type: string
        required: true
        default: 'XIAORAN67_GITHUB_TOKEN'
      target_token_name:
        description: '目标仓库Token的Secret名称'
        type: string
        required: true
        default: 'XIAORAN37_GITHUB_TOKEN'
      
      # 同步策略
      sync_strategy:
        description: '同步策略'
        type: choice
        required: true
        options:
          - '增量'
          - '覆盖'
        default: '增量'
      target_private:
        description: '目标仓库是否私有'
        type: boolean
        required: true
        default: false
      commit_template:
        description: '提交信息模板'
        type: choice
        required: true
        options:
          - '仅时间'
          - '同步说明'
          - '自定义'
        default: '仅时间'
      custom_commit_msg:
        description: '自定义提交信息（选"自定义"时填写）'
        type: string
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 1. 检查Token
      - name: 🔑 校验Token存在性
        run: |
          if [ -z "${{ secrets[inputs.source_token_name] }}" ]; then
            echo "错误：源仓库Token（${{ inputs.source_token_name }}）不存在" && exit 1
          fi
          if [ -z "${{ secrets[inputs.target_token_name] }}" ]; then
            echo "错误：目标仓库Token（${{ inputs.target_token_name }}）不存在" && exit 1
          fi

      # 2. 准备同步脚本
      - name: 📦 准备同步脚本
        run: |
          cat > sync_repo.sh << 'EOF'
          #!/bin/bash
          
          # 参数
          SOURCE="$1"
          SOURCE_FOLDER="$2"
          TARGET="$3"
          TARGET_FOLDER="$4"
          SOURCE_TOKEN="$5"
          TARGET_TOKEN="$6"
          SYNC_STRATEGY="$7"
          TARGET_PRIVATE="$8"
          COMMIT_TEMPLATE="$9"
          CUSTOM_COMMIT_MSG="${10}"
          
          echo "开始同步: ${SOURCE} → ${TARGET}"
          
          # 解析源仓库信息
          if ! echo "${SOURCE}" | grep -qE '^[a-zA-Z0-9-]+/[a-zA-Z0-9-]+@[a-zA-Z0-9-]+$'; then
            echo "错误：源仓库格式应为 用户名/仓库名@分支" && exit 1
          fi
          IFS='/@' read -r source_user source_repo source_branch <<< "${SOURCE}"
          
          # 解析目标仓库信息
          if ! echo "${TARGET}" | grep -qE '^[a-zA-Z0-9-]+/[a-zA-Z0-9-]+@[a-zA-Z0-9-]+$'; then
            echo "错误：目标仓库格式应为 用户名/仓库名@分支" && exit 1
          fi
          IFS='/@' read -r target_user target_repo target_branch <<< "${TARGET}"
          
          # 检查/创建目标仓库
          REPO_CHECK_URL="https://api.github.com/repos/${target_user}/${target_repo}"
          REPO_EXISTS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token ${TARGET_TOKEN}" "${REPO_CHECK_URL}")
          
          if [ "${REPO_EXISTS}" -eq 404 ]; then
            echo "ℹ️ 目标仓库不存在，开始创建..."
            CREATE_BODY=$(jq -n \
              --arg name "${target_repo}" \
              --argjson private "${TARGET_PRIVATE}" \
              --arg default_branch "${target_branch}" \
              '{"name": $name, "private": $private, "auto_init": true, "default_branch": $default_branch}')
            
            CREATE_RESPONSE=$(curl -s -w "%{http_code}" -o create_result.json \
              -X POST \
              -H "Authorization: token ${TARGET_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/user/repos" \
              -d "${CREATE_BODY}")
            
            if [ "${CREATE_RESPONSE}" -ne 201 ]; then
              echo "❌ 目标仓库创建失败：$(cat create_result.json)" && exit 1
            fi
          elif [ "${REPO_EXISTS}" -ne 200 ]; then
            echo "❌ 检查仓库状态失败，HTTP码：${REPO_EXISTS}" && exit 1
          fi
          
          # 检出源仓库
          git clone --branch "${source_branch}" \
            "https://${SOURCE_TOKEN}@github.com/${source_user}/${source_repo}.git" \
            source_repo_temp
          
          # 检出目标仓库
          git clone --branch "${target_branch}" \
            "https://${TARGET_TOKEN}@github.com/${target_user}/${target_repo}.git" \
            target_repo_temp
          
          cd target_repo_temp && git pull origin "${target_branch}" && cd ..
          
          # 安装依赖
          sudo apt-get install -y rsync jq
          
          # 定义源/目标路径
          SOURCE_PATH="source_repo_temp/${SOURCE_FOLDER}"
          [ -z "${SOURCE_FOLDER}" ] && SOURCE_PATH="source_repo_temp"
          TARGET_PATH="target_repo_temp/${TARGET_FOLDER}"
          [ -z "${TARGET_FOLDER}" ] && TARGET_PATH="target_repo_temp"
          mkdir -p "${TARGET_PATH}"
          
          # 关键：统一时区+保留源文件时间戳
          export TZ='Asia/Shanghai'
          
          # 执行同步
          if [ "${SYNC_STRATEGY}" = "增量" ]; then
            rsync -av --times --exclude=".git/" "${SOURCE_PATH}/" "${TARGET_PATH}/"
          else
            rsync -av --delete --force --times --exclude=".git/" "${SOURCE_PATH}/" "${TARGET_PATH}/"
          fi
          
          # 检测变化
          cd target_repo_temp
          if git status --porcelain | grep -q .; then
            CHANGES_DETECTED="true"
          else
            CHANGES_DETECTED="false"
          fi
          
          # 推送更新
          if [ "${CHANGES_DETECTED}" = "true" ]; then
            if ! git status --porcelain | grep -q .; then
              echo "ℹ️ 无实际变更，跳过提交"
              exit 0
            fi
            
            git config user.name "Sync Bot"
            git config user.email "sync@noreply.github.com"
            git add . --force
            
            # 生成提交信息
            CURRENT_DATE=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')
            SRC_INFO="${source_user}/${source_repo}:${source_branch}[${SOURCE_FOLDER:-根目录}]"
            TGT_INFO="${target_user}/${target_repo}:${target_branch}[${TARGET_FOLDER:-根目录}]"
            
            if [ "${COMMIT_TEMPLATE}" = "仅时间" ]; then
              COMMIT_MSG="🚀 ${CURRENT_DATE}"
            elif [ "${COMMIT_TEMPLATE}" = "同步说明" ]; then
              COMMIT_MSG="🔄 同步（时间戳+大小校验） ${SRC_INFO} → ${TGT_INFO}（${CURRENT_DATE}）"
            else
              COMMIT_MSG="${CUSTOM_COMMIT_MSG}"
              [ -z "${COMMIT_MSG}" ] && COMMIT_MSG="🚀 ${CURRENT_DATE}"
            fi
            
            git commit -m "${COMMIT_MSG}"
            PUSH_URL="https://${TARGET_TOKEN}@github.com/${target_user}/${target_repo}.git"
            
            if [ "${SYNC_STRATEGY}" = "覆盖" ]; then
              git push "${PUSH_URL}" "${target_branch}" --force
            else
              git push "${PUSH_URL}" "${target_branch}"
            fi
            
            echo "✅ 同步完成！"
            echo "📌 源仓库：${SRC_INFO}"
            echo "📌 目标仓库：${TGT_INFO}"
          else
            echo "ℹ️ 源文件与目标文件完全一致（时间戳+大小匹配），无需同步"
          fi
          
          # 清理临时目录
          cd ..
          rm -rf source_repo_temp target_repo_temp
          EOF
          
          chmod +x sync_repo.sh

      # 3. 执行同步
      - name: 🚀 执行仓库同步
        env:
          SOURCE_TOKEN: ${{ secrets[inputs.source_token_name] }}
          TARGET_TOKEN: ${{ secrets[inputs.target_token_name] }}
        run: |
          if [ "${{ inputs.sync_mode }}" = "单一仓库" ]; then
            echo "执行单一仓库同步..."
            ./sync_repo.sh \
              "${{ inputs.single_source }}" \
              "${{ inputs.single_source_folder }}" \
              "${{ inputs.single_target }}" \
              "${{ inputs.single_target_folder }}" \
              "${SOURCE_TOKEN}" \
              "${TARGET_TOKEN}" \
              "${{ inputs.sync_strategy }}" \
              "${{ inputs.target_private }}" \
              "${{ inputs.commit_template }}" \
              "${{ inputs.custom_commit_msg }}"
          else
            echo "执行全部仓库同步..."
            
            # 定义全部仓库列表
            REPO_PAIRS=(
              "xiaoran67/core@main:xiaoran37/core@main::"
              "xiaoran67/update@main:xiaoran37/update@main::"
              "xiaoran67/xiaoran37@main:xiaoran37/xiaoran37@main::"
              "xiaoran67/xiaoran67@main:xiaoran37/xiaoran67@main::"
            )
            
            for pair in "${REPO_PAIRS[@]}"; do
              IFS=':' read -r source_repo target_repo source_folder target_folder <<< "${pair}"
              
              # 设置默认值
              [ -z "${source_folder}" ] && source_folder="${{ inputs.single_source_folder }}"
              [ -z "${target_folder}" ] && target_folder="${{ inputs.single_target_folder }}"
              
              echo "正在同步: ${source_repo} → ${target_repo}"
              
              ./sync_repo.sh \
                "${source_repo}" \
                "${source_folder}" \
                "${target_repo}" \
                "${target_folder}" \
                "${SOURCE_TOKEN}" \
                "${TARGET_TOKEN}" \
                "${{ inputs.sync_strategy }}" \
                "${{ inputs.target_private }}" \
                "${{ inputs.commit_template }}" \
                "${{ inputs.custom_commit_msg }}" || echo "同步失败: ${source_repo} → ${target_repo}"
              
              echo "----------------------------------------"
            done
            
            echo "🎉 全部仓库同步完成！"
          fi

      # 4. 清理工作
      - name: 🧹 清理工作空间
        if: always()
        run: |
          rm -f sync_repo.sh
